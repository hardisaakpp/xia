# Set de evaluación de Xia. BORRADOR: las respuestas esperadas las verificó Claude contra los documentos de
# api-odc-mba3 (2026-09-30); falta ampliarlo con preguntas REALES de usuarios, que es lo que más vale.
#
# Cada pregunta:
#   contiene:      lista; TODOS los elementos deben aparecer en la respuesta (sin importar mayúsculas, tildes
#                  ni '_' vs ' '). Un elemento que es lista significa "alguno de estos".
#   documentos:    la recuperación acierta si algún documento esperado está entre los fragmentos recuperados.
#   sin_contexto:  true = Xia debe negarse (la documentación no lo cubre).

