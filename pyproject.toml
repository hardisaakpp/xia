[project]
name = "xia"
version = "0.1.0"
description = "Xia: asistente RAG de SCNexus sobre documentación organizacional."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "httpx>=0.27",
  "psycopg[binary,pool]>=3.1",
  "pgvector>=0.3",
  "numpy>=1.26",
  "pydantic-settings>=2.2",
  "pyyaml>=6.0",
  "pyjwt>=2.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Reranker opcional (XIA_RERANKER=cross-encoder). Instalar antes PyTorch: pip install torch --index-url https://download.pytorch.org/whl/cpu
rerank = ["sentence-transformers>=3.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
