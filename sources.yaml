# Catálogo de áreas y sus fuentes. Agregar un módulo nuevo = agregar una entrada acá y reindexar
# (`python -m xia.indexer`); no hay que tocar el código del pipeline.
# Las rutas relativas se resuelven desde la carpeta de este archivo.
#
# PERMISOS (obligatorios para que alguien distinto de un Admin vea el área):
#   permisos: [..]            Basta UNO de ellos en el JWT de SCNexus Core (claim `permission`).
#                             `modulo.*` = cualquier permiso que empiece por `modulo.`; `*` = cualquier usuario autenticado.
#   permisos_por_patron: [..] Permisos por documento (primera regla cuyo `patron` coincida con la ruta); sustituye al del área.
# Sin permisos declarados, el área solo la ve el rol Admin (denegar por defecto). Tras cambiarlos: `python -m xia.indexer`.
areas:
  - codigo: odc-mba3
    nombre: Gestión de ODC / MBA3
    descripcion: Documentación de api-odc-mba3 (pedidos, órdenes de compra, integración SAP).
    # Preguntas de ejemplo que Xia sugiere cuando algo queda fuera de alcance (deben poder responderse con estos documentos).
    ejemplos:
      - "¿Qué estado tiene un pedido cuando falla el envío de la ODC a SAP?"
      - "¿Qué permiso necesita el perfil Producción El Rayo?"
      - "¿Qué hace la reconciliación automática diaria?"
    permisos: [odcsap.view, produccion-elrayo.view, mabel.view]
    fuente:
      tipo: carpeta
      ruta: ../api-odc-mba3/docs
      patrones: ["**/*.md"]
      excluir: []

  - codigo: promocion-sobres
    nombre: Promoción Sobres (cromos)
    descripcion: "Documentación de api-cromos (entrega de obsequios ONE CARD: consulta de cédula, validación de código, monitoreo)."
    ejemplos:
      - "¿Qué pasa si escaneo el código de un cliente que ya recibió su obsequio?"
      - "¿Qué permiso necesita un supervisor para ver el monitoreo de entregas?"
      - "¿Cómo registra la API la entrega de un obsequio?"
    permisos: [promocion.sobres.*, boton-monitorear.view]
    fuente:
      tipo: carpeta
      ruta: ../api-cromos
      patrones: ["README.md", "docs/**/*.md"]
      excluir: []

  # ── Áreas técnicas del ecosistema SCNexus ──────────────────────────────────────────────────────────────────
  # Criterio: se indexa documentación funcional y técnica; se EXCLUYEN despliegue, infraestructura, CI/CD, políticas de
  # revisión de código y documentos históricos. Los secretos que aún aparezcan se enmascaran en xia.redaccion.
  - codigo: core-scnexus
    nombre: SCNexus Core (autenticación y permisos)
    descripcion: "Documentación de api-core-scnexus (login, Active Directory, usuarios, roles y permisos, JWT, endpoints)."
    ejemplos:
      - "¿Cómo se autentica un usuario en SCNexus Core?"
      - "¿Cómo se crea un módulo nuevo que use el Core?"
      - "¿Qué endpoints tiene el Core para gestionar usuarios y permisos?"
    permisos: [xia.tecnico]  # documentación técnica: desarrolladores (permiso a asignar en Core)
    fuente:
      tipo: carpeta
      ruta: ../api-core-scnexus
      patrones: ["README.md", "docs/**/*.md"]
      excluir: ["docs/Diagrama.md", "docs/DEPLOY.md", "docs/AUTO-DEPLOY.md", "docs/BINARY-DEPLOY.md", "docs/CICD.md",
                "docs/sonarqube-review-policy.md"]

  - codigo: middleware-sap
    nombre: Middleware SAP
    descripcion: "Documentación de api-middleware-sap (integración con SAP Business One: contrato, idempotencia, concurrencia, cola de trabajos)."
    ejemplos:
      - "¿Cómo evita el middleware crear un documento duplicado en SAP?"
      - "¿Cómo funciona la cola de trabajos del middleware?"
      - "¿Qué variables de configuración necesita el middleware?"
    permisos: [xia.tecnico]  # documentación técnica: desarrolladores (permiso a asignar en Core)
    fuente:
      tipo: carpeta
      ruta: ../api-middleware-sap
      patrones: ["README.md", "docs/**/*.md"]
      excluir: ["docs/sonarqube-review-policy.md"]

  - codigo: scnexus-manuales
    nombre: Manuales de usuario de SCNexus
    descripcion: "Manuales de usuario de los módulos del portal SCNexus (inventario, caja chica, transferencias, recepción, usuarios, integraciones, artículos)."
    ejemplos:
      - "¿Cómo registro una recepción de mercadería?"
      - "¿Cómo se hace una transferencia de stock?"
      - "¿Cómo creo un usuario nuevo y le asigno permisos?"
    # Un manual lo ve quien tiene algún permiso de ese módulo (los espacios de nombres salen de los router.ts del frontend).
    permisos_por_patron:
      - {patron: "MANUAL_USUARIO_MODULO_ARTICULO_SCANER.md", permisos: ["articuloscaner.*"]}
      - {patron: "MANUAL_USUARIO_MODULO_CAJA_CHICA.md", permisos: ["cajachica.*"]}
      - {patron: "MANUAL_USUARIO_MODULO_INTEGRACIONES.md", permisos: ["integraciones.*"]}
      - {patron: "MANUAL_USUARIO_MODULO_INVENTARIO.md", permisos: ["inventario.*"]}
      - {patron: "MANUAL_USUARIO_MODULO_USUARIOS.md", permisos: ["gestionusuarios.*", "staff.*"]}
      - {patron: "MANUAL_USUARIO_RECEPCION_MERCADERIA.md", permisos: ["recepcion.*"]}
      - {patron: "MANUAL_USUARIO_TRANSFERENCIASSTOCK_SCNEXUS.md", permisos: ["transferenciadirecta.*"]}
    fuente:
      tipo: carpeta
      ruta: ../web-scnexus/docs
      patrones: ["MANUAL_USUARIO_*.md"]
      # El manual MBA3 de febrero está superado: el vigente es el de api-odc-mba3 (área odc-mba3).
      excluir: ["MANUAL_USUARIO_MBA3.md"]

  - codigo: scnexus-frontend
    nombre: Frontend de SCNexus (arquitectura)
    descripcion: "Documentación técnica del frontend web-scnexus (arquitectura, módulos, permisos, convenciones)."
    ejemplos:
      - "¿Cómo se agrega un módulo nuevo al frontend?"
      - "¿Cómo funcionan los permisos en el frontend?"
      - "¿Qué módulos tiene el portal SCNexus?"
    permisos: [xia.tecnico]  # documentación técnica: desarrolladores (permiso a asignar en Core)
    fuente:
      tipo: carpeta
      ruta: ../web-scnexus
      patrones: ["README.md", "docs/FRONTEND.md", "docs/ARQUITECTURA_Y_NUEVOS_MODULOS.md", "docs/MODULOS.md",
                 "docs/SISTEMA_PERMISOS.md", "docs/FUNCIONALIDADES_ESTANDARIZADAS.md", "docs/MODULO_INTEGRACIONES.md"]
      excluir: []
