# Catálogo de áreas y sus fuentes. Agregar un módulo nuevo = agregar una entrada acá y reindexar
# (`python -m xia.indexer`); no hay que tocar el código del pipeline.
# Las rutas relativas se resuelven desde la carpeta de este archivo.
areas:
  - codigo: odc-mba3
    nombre: Gestión de ODC / MBA3
    descripcion: Documentación de api-odc-mba3 (pedidos, órdenes de compra, integración SAP).
    # Preguntas de ejemplo que Xia sugiere cuando algo queda fuera de alcance (deben poder responderse con estos documentos).
    ejemplos:
      - "¿Qué estado tiene un pedido cuando falla el envío de la ODC a SAP?"
      - "¿Qué permiso necesita el perfil Producción El Rayo?"
      - "¿Qué hace la reconciliación automática diaria?"
    fuente:
      tipo: carpeta
      ruta: ../api-odc-mba3/docs
      patrones: ["**/*.md"]
      excluir: []

  - codigo: promocion-sobres
    nombre: Promoción Sobres (cromos)
    descripcion: "Documentación de api-cromos (entrega de obsequios ONE CARD: consulta de cédula, validación de código, monitoreo)."
    ejemplos:
      - "¿Qué pasa si escaneo el código de un cliente que ya recibió su obsequio?"
      - "¿Qué permiso necesita un supervisor para ver el monitoreo de entregas?"
      - "¿Cómo registra la API la entrega de un obsequio?"
    fuente:
      tipo: carpeta
      ruta: ../api-cromos
      patrones: ["README.md", "docs/**/*.md"]
      excluir: []
