# Desarrollo: `docker compose up -d db` y la API en el host (venv), o `--profile app` para todo en Docker.
services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: xia
      POSTGRES_PASSWORD: xia # solo desarrollo; en servidor usar secreto
      POSTGRES_DB: xia
    ports:
      - "127.0.0.1:5433:5432" # 5433 para no chocar con otros Postgres del equipo
    volumes:
      - xia-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xia -d xia"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    profiles: ["app"]
    build: .
    restart: unless-stopped # sobrevive a reinicios del equipo (mientras no se detenga a mano)
    ports:
      - "127.0.0.1:8900:8900"
    environment:
      XIA_DATABASE_URL: postgresql://xia:xia@db:5432/xia
      # Ollama corre en el equipo (usa la GPU), no en Docker. host.docker.internal lo ofrece Docker Desktop;
      # con Docker Engine (servidor) hay que agregar `extra_hosts: ["host.docker.internal:host-gateway"]`
      # y hacer que Ollama escuche fuera de 127.0.0.1 (OLLAMA_HOST).
      XIA_OLLAMA_URL: http://host.docker.internal:11434
      # Identidad: el JWT de SCNexus Core. Los valores salen del .env (misma clave, emisor y audiencia que el Core).
      XIA_AUTENTICACION: ${XIA_AUTENTICACION:-jwt}
      XIA_JWT_SECRET: ${XIA_JWT_SECRET:-}
      XIA_JWT_ISSUER: ${XIA_JWT_ISSUER:-}
      XIA_JWT_AUDIENCE: ${XIA_JWT_AUDIENCE:-}
    volumes:
      # sources.yaml resuelve las rutas relativas a su carpeta (/app): ../api-odc-mba3/docs -> /api-odc-mba3/docs
      - ../api-odc-mba3/docs:/api-odc-mba3/docs:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  xia-db:
