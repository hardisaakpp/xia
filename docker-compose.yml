# Desarrollo: `docker compose up -d db` y la API en el host (venv), o `--profile app` para todo en Docker.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: xia
      POSTGRES_PASSWORD: xia # solo desarrollo; en servidor usar secreto
      POSTGRES_DB: xia
    ports:
      - "127.0.0.1:5433:5432" # 5433 para no chocar con otros Postgres del equipo
    volumes:
      - xia-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xia -d xia"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    profiles: ["app"]
    build: .
    # Host network: Ollama escucha solo en 127.0.0.1 y así no hay que exponerlo en la red.
    network_mode: host
    environment:
      XIA_DATABASE_URL: postgresql://xia:xia@127.0.0.1:5433/xia
      XIA_OLLAMA_URL: http://127.0.0.1:11434
    volumes:
      # sources.yaml resuelve las rutas relativas a su carpeta (/app): ../api-odc-mba3/docs -> /api-odc-mba3/docs
      - ../api-odc-mba3/docs:/api-odc-mba3/docs:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  xia-db:
